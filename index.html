<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 출석 관리 시스템</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --success: #22c55e;
            --warning: #eab308;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); padding: 30px 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .title-area h1 { font-size: 1.5rem; font-weight: 700; color: #1e293b; display: flex; align-items: center; gap: 8px; }
        .title-area p { font-size: 0.875rem; color: var(--text-sub); margin-top: 4px; }
        .date-input { padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; outline: none; background: #fff; cursor: pointer; }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
        .stat-card { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .stat-label { font-size: 0.85rem; font-weight: 600; color: var(--text-sub); }
        .stat-value { font-size: 1.75rem; font-weight: 800; margin-top: 4px; }
        .stat-icon { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        
        .stat-card.total .stat-value { color: #0f172a; }
        .stat-card.total .stat-icon { background: #f1f5f9; color: #475569; }
        .stat-card.present .stat-value { color: var(--success); }
        .stat-card.present .stat-icon { background: #dcfce7; color: var(--success); }
        .stat-card.late .stat-value { color: var(--warning); }
        .stat-card.late .stat-icon { background: #fef9c3; color: var(--warning); }
        .stat-card.absent .stat-value { color: var(--danger); }
        .stat-card.absent .stat-icon { background: #fee2e2; color: var(--danger); }

        .progress-card { background: var(--card-bg); padding: 16px 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 24px; }
        .progress-header { display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; }
        .progress-bar-bg { width: 100%; height: 10px; background: #f1f5f9; border-radius: 5px; overflow: hidden; }
        .progress-bar-fill { height: 100%; width: 0%; background: var(--primary); transition: width 0.3s; }

        .card { background: var(--card-bg); padding: 24px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 24px; }
        .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

        .input-row { display: flex; gap: 12px; flex-wrap: wrap; }
        .input-field { padding: 12px 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; outline: none; flex: 1; min-width: 180px; }
        .input-field:focus { border-color: var(--primary); }
        
        .btn { padding: 12px 20px; border: none; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.2s; white-space: nowrap; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-neis { background: #0284c7; color: #fff; }
        .btn-neis:hover { background: #0369a1; }
        
        .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .list-desc { font-size: 0.875rem; color: var(--text-sub); }
        .bulk-actions { display: flex; gap: 8px; align-items: center; }
        .btn-sm { padding: 6px 12px; font-size: 0.8rem; border-radius: 6px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-weight: 600; }
        .btn-sm:hover { background: #f8fafc; }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { padding: 12px 16px; font-size: 0.85rem; font-weight: 600; color: var(--text-sub); border-bottom: 1px solid var(--border); background: #fafafa; }
        td { padding: 16px; border-bottom: 1px solid var(--border); font-size: 0.95rem; vertical-align: middle; }
        
        .badge-dept { display: inline-block; padding: 4px 10px; background: #f1f5f9; color: #475569; border-radius: 6px; font-size: 0.8rem; font-weight: 500; }
        .status-group { display: flex; gap: 6px; }
        .status-btn { padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: #fff; font-size: 0.85rem; font-weight: 600; color: var(--text-sub); cursor: pointer; }
        .status-btn.active-present { background: #dcfce7; color: #166534; border-color: #86efac; }
        .status-btn.active-late { background: #fef9c3; color: #854d0e; border-color: #fde047; }
        .status-btn.active-absent { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }

        .btn-icon { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 1.1rem; padding: 4px; border-radius: 4px; }
        .btn-icon:hover { color: var(--danger); background: #fee2e2; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="title-area">
                <h1>👤 스마트 출석 관리 시스템</h1>
                <p>부원 및 학생 출석 현황을 효율적으로 관리하세요</p>
            </div>
            <input type="date" id="attendanceDate" class="date-input">
        </header>

        <!-- 대시보드 카드 -->
        <div class="stats-grid">
            <div class="stat-card total">
                <div>
                    <div class="stat-label">전체 등록 인원</div>
                    <div id="countTotal" class="stat-value">0명</div>
                </div>
                <div class="stat-icon">👥</div>
            </div>
            <div class="stat-card present">
                <div>
                    <div class="stat-label">출석</div>
                    <div id="countPresent" class="stat-value">0명</div>
                </div>
                <div class="stat-icon">👤</div>
            </div>
            <div class="stat-card late">
                <div>
                    <div class="stat-label">지각</div>
                    <div id="countLate" class="stat-value">0명</div>
                </div>
                <div class="stat-icon">⏰</div>
            </div>
            <div class="stat-card absent">
                <div>
                    <div class="stat-label">결석</div>
                    <div id="countAbsent" class="stat-value">0명</div>
                </div>
                <div class="stat-icon">❌</div>
            </div>
        </div>

        <!-- 출석률 진행 바 -->
        <div class="progress-card">
            <div class="progress-header">
                <span>오늘의 출석률</span>
                <span id="rateText">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div id="rateBar" class="progress-bar-fill"></div>
            </div>
        </div>

        <!-- 새 구성원 추가 & 나이스 연동 카드 -->
        <div class="card">
            <div class="card-title">➕ 새 구성원 추가 / 연동</div>
            <div class="input-row">
                <input type="text" id="memberName" class="input-field" placeholder="이름 (예: 홍길동)">
                <input type="text" id="memberDept" class="input-field" placeholder="소속 / 직책 (예: 화성고 / 학생)">
                <button class="btn btn-primary" onclick="addMember()">+ 추가하기</button>
                <!-- 🌟 혜택: 나이스 데이터 불러오기 버튼 추가 -->
                <button class="btn btn-neis" onclick="pasteNeisData()">📥 나이스 데이터 불러오기</button>
            </div>
        </div>

        <!-- 출석 명부 카드 -->
        <div class="card">
            <div class="list-header">
                <div>
                    <div class="card-title" style="margin-bottom:4px;">출석 명부</div>
                    <div class="list-desc">상태 버튼을 클릭하여 출석 여부를 수시로 업데이트할 수 있습니다.</div>
                </div>
                <div class="bulk-actions">
                    <span>일괄 처리:</span>
                    <button class="btn-sm" style="color:var(--success);" onclick="setAllStatus('present')">전원 출석</button>
                    <button class="btn-sm" style="color:var(--danger);" onclick="setAllStatus('absent')">전원 결석</button>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>이름</th>
                        <th>소속 / 직책</th>
                        <th>출석 상태 선택</th>
                        <th style="text-align:right;">관리</th>
                    </tr>
                </thead>
                <tbody id="memberList"></tbody>
            </table>
        </div>
    </div>

    <script>
        let members = JSON.parse(localStorage.getItem('attendance_members')) || [
            { name: '이영희', dept: '소프트웨어학과' },
            { name: '박민수', dept: '인공지능학과' }
        ];
        let records = JSON.parse(localStorage.getItem('attendance_records')) || {};

        const dateInput = document.getElementById('attendanceDate');
        dateInput.value = new Date().toISOString().substring(0, 10);
        dateInput.addEventListener('change', renderList);

        function saveData() {
            localStorage.setItem('attendance_members', JSON.stringify(members));
            localStorage.setItem('attendance_records', JSON.stringify(records));
        }

        function addMember() {
            const nameInput = document.getElementById('memberName');
            const deptInput = document.getElementById('memberDept');
            const name = nameInput.value.trim();
            const dept = deptInput.value.trim() || '학생';

            if (!name) return alert('이름을 입력해주세요.');

            if (!members.some(m => m.name === name)) {
                members.push({ name, dept });
                saveData();
                renderList();
                nameInput.value = '';
                deptInput.value = '';
            } else {
                alert('이미 등록된 이름입니다.');
            }
        }

        // 🌟 나이스 클립보드 데이터를 읽어와서 반영하는 연동 함수
        async function pasteNeisData() {
            try {
                const text = await navigator.clipboard.readText();
                const data = JSON.parse(text);

                if (!Array.isArray(data) || data.length === 0) {
                    throw new Error("올바른 데이터 형식이 아닙니다.");
                }

                const date = dateInput.value;
                if (!records[date]) records[date] = {};

                let addedCount = 0;
                data.forEach(item => {
                    const studentName = item.name;
                    // 1. 명단에 없으면 자동 추가
                    if (!members.some(m => m.name === studentName)) {
                        members.push({ name: studentName, dept: '학생' });
                        addedCount++;
                    }
                    
                    // 2. 출결 상태 매핑 ('질병결석', '무단결석' -> absent)
                    let mappedStatus = 'present';
                    if (item.status && item.status.includes('결석')) {
                        mappedStatus = 'absent';
                    } else if (item.status && item.status.includes('지각')) {
                        mappedStatus = 'late';
                    }

                    records[date][studentName] = mappedStatus;
                });

                saveData();
                renderList();
                alert(`🎉 나이스 출결 데이터(${data.length}명)가 성공적으로 반영되었습니다!`);

            } catch (err) {
                alert('클립보드에 올바른 나이스 데이터가 없습니다.\n먼저 나이스 화면에서 북마크를 클릭해 출결 데이터를 복사해 주세요!');
            }
        }

        function setStatus(name, status) {
            const date = dateInput.value;
            if (!records[date]) records[date] = {};
            records[date][name] = status;
            saveData();
            renderList();
        }

        function setAllStatus(status) {
            const date = dateInput.value;
            if (!records[date]) records[date] = {};
            members.forEach(m => {
                records[date][m.name] = status;
            });
            saveData();
            renderList();
        }

        function deleteMember(name) {
            if (!confirm(`${name} 님을 명단에서 삭제하시겠습니까?`)) return;
            members = members.filter(m => m.name !== name);
            saveData();
            renderList();
        }

        function renderList() {
            const listEl = document.getElementById('memberList');
            const date = dateInput.value;
            listEl.innerHTML = '';

            let present = 0, late = 0, absent = 0;

            members.forEach(m => {
                const name = m.name;
                const dept = m.dept || '학생';
                const status = (records[date] && records[date][name]) || 'none';
                
                if (status === 'present') present++;
                if (status === 'late') late++;
                if (status === 'absent') absent++;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${name}</strong></td>
                    <td><span class="badge-dept">${dept}</span></td>
                    <td>
                        <div class="status-group">
                            <button class="status-btn ${status === 'present' ? 'active-present' : ''}" onclick="setStatus('${name}', 'present')">✓ 출석</button>
                            <button class="status-btn ${status === 'late' ? 'active-late' : ''}" onclick="setStatus('${name}', 'late')">⏰ 지각</button>
                            <button class="status-btn ${status === 'absent' ? 'active-absent' : ''}" onclick="setStatus('${name}', 'absent')">✕ 결석</button>
                        </div>
                    </td>
                    <td style="text-align:right;">
                        <button class="btn-icon" onclick="deleteMember('${name}')" title="삭제">🗑️</button>
                    </td>
                `;
                listEl.appendChild(tr);
            });

            // 대시보드 데이터 및 그래프 갱신
            const total = members.length;
            document.getElementById('countTotal').innerText = `${total}명`;
            document.getElementById('countPresent').innerText = `${present}명`;
            document.getElementById('countLate').innerText = `${late}명`;
            document.getElementById('countAbsent').innerText = `${absent}명`;

            const rate = total > 0 ? Math.round((present / total) * 100) : 0;
            document.getElementById('rateText').innerText = `${rate}%`;
            document.getElementById('rateBar').style.width = `${rate}%`;
        }

        renderList();
    </script>
</body>
</html>
